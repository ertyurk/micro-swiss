[package]
name = "micro-swiss"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ms"
path = "src/main.rs"

[features]
default = ["full"]
db = ["dep:tokio", "dep:tokio-postgres", "dep:csv"]
http = ["dep:reqwest"]
full = ["db", "http"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
colored = "3.1"
arboard = "3.6"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "0.8"
chrono = "0.4.43"
md5 = "0.8.0"
sha2 = "0.10.9"
qrcode = "0.14.1"
regex = "1.12"
uuid = { version = "1.21", features = ["v4", "v7"] }
url = "2.5"
thiserror = "2"
similar = "2.7"

# Feature-gated deps
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
csv = { version = "1.4", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
